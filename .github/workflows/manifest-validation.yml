name: Validate Kubernetes manifests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Lint all Helm charts
        run: |
          find charts -name Chart.yaml -print0 |
          while IFS= read -r -d '' chart_file; do
            chart_dir=$(dirname "$chart_file")
            echo "Linting $chart_dir"
            helm lint "$chart_dir"
          done

      - name: Validate Rails Kustomize
        run: |
          kubectl kustomize apps/rails-app
