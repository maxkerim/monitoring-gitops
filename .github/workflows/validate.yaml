name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  helm-and-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint and validate local charts
        shell: bash
        run: |
          set -euo pipefail
          for chart in charts/*; do
            [[ -f "$chart/Chart.yaml" ]] || continue
            helm lint "$chart"
            helm template "$(basename "$chart")" "$chart" \
              | kubeconform -strict -ignore-missing-schemas -summary -
          done

      - name: Lint and validate upstream Grafana chart
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update grafana
          helm pull grafana/grafana --version 9.2.7 --untar --untardir "$RUNNER_TEMP"
          helm lint "$RUNNER_TEMP/grafana"
          helm template grafana "$RUNNER_TEMP/grafana" \
            --set admin.existingSecret=grafana-admin \
            | kubeconform -strict -ignore-missing-schemas -summary -

      - name: Validate Argo CD Applications
        run: kubeconform -strict -ignore-missing-schemas -summary argo-apps/monitoring.yaml argo-apps/apps/*.yaml
