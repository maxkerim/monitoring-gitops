
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 9.2.7
    helm:
      values: |
        adminUser: admin
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        service:
          type: ClusterIP
          port: 80
          targetPort: 3000
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                type: prometheus
                access: proxy
                url: http://victoriametrics-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
                isDefault: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
